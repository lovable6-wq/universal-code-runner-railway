<style>

*{box-sizing:border-box}

.bg{position:fixed;inset:0;background:#000}

.body{flex:1;overflow:auto;padding:14px}
.dock{position:fixed;z-index:99999;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:28px;max-width:calc(100vw - 24px);overflow-x:auto}
.dock button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:10px 16px;border-radius:20px;min-height:44px;white-space:nowrap;transition:background .2s}
.dock button:hover,.dock button.on{background:rgba(255,255,255,.22)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{border-radius:20px;padding:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);display:flex;flex-direction:column;gap:10px}
.head{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700;font-size:20px;object-fit:cover;flex:none}
.head h3{margin:0;font-size:16px}.mute{color:var(--mute);font-size:13px}
.st{display:flex;align-items:center;gap:7px;font-size:13px}.st i{width:9px;height:9px;border-radius:50%;flex:none}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;color:var(--mute)}.meta span b{color:var(--ink);font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--edge);background:rgba(255,255,255,.12);color:var(--ink);border-radius:13px;padding:8px 12px;font:inherit;font-size:13px;min-height:40px;transition:background .2s,transform .1s}
.btn:hover{background:rgba(255,255,255,.24)}.btn.pri:hover{background:#e6e6e6}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.pri{background:#fff;color:#000;border-color:#fff}.btn.dng{color:#ffb3bd}
.err{color:var(--bad);font-size:13px;margin:0}
.in{width:100%;border:1px solid var(--edge);background:rgba(0,0,0,.22);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;min-height:42px}
.row{display:flex;gap:10px;align-items:center;margin:6px 0}.row code{flex:1;font-family:var(--mono);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.log{margin:0;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}.log .err{font-size:12px}
.stack{display:flex;flex-direction:column;gap:10px}
h4{margin:14px 0 4px;font-size:14px}
#login{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;padding:20px}
#login .box{width:min(380px,100%);border-radius:28px;padding:24px}

@media(max-width:700px){
 .win{inset:0!important;width:auto!important;height:auto!important;border-radius:0;resize:none;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
 .win:not(.top){display:none}.bar{padding-top:calc(11px + env(safe-area-inset-top));cursor:default}
 .dot{width:26px;height:26px}.dock{left:12px;right:12px;transform:none;justify-content:flex-start}
 .grid{grid-template-columns:1fr}}

   h('div',{class:'head'},av,h('div',{},h('h3',{},(p.discord&&p.discord.name)||p.name),h('div',{class:'mute'},[p.kind,p.lang,p.lib].filter(Boolean).join(' · ')+(p.discord&&p.discord.id?' · ID '+p.discord.id:'')))),
   h('div',{class:'st'},h('i',{style:'background:'+col}),stl,typeof conn==='string'?h('span',{class:'mute'},'· '+conn):null),

/* ---- terminal real (xterm.js + PTY en el servidor) ---- */
